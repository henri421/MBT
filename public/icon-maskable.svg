<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tieGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>
    <linearGradient id="strutGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Full-bleed background: required for maskable icons (no rounded corners, OS applies its own mask) -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Graphic scaled ~72% and centered so it survives circular/squircle masking (safe zone) -->
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <path d="M 80 120 L 320 120 L 430 230 L 430 400 L 80 400 Z" fill="#334155" opacity="0.4" stroke="#475569" stroke-width="4" stroke-dasharray="8 6" />
    <line x1="300" y1="140" x2="180" y2="340" stroke="url(#strutGrad)" stroke-width="28" stroke-linecap="round" />
    <line x1="120" y1="140" x2="180" y2="340" stroke="url(#strutGrad)" stroke-width="22" stroke-linecap="round" />
    <line x1="120" y1="140" x2="300" y2="140" stroke="url(#tieGrad)" stroke-width="18" stroke-linecap="round" />
    <line x1="120" y1="140" x2="120" y2="340" stroke="url(#tieGrad)" stroke-width="14" stroke-linecap="round" />
    <circle cx="300" cy="140" r="22" fill="#ffffff" stroke="#ef4444" stroke-width="8" />
    <circle cx="120" cy="140" r="22" fill="#ffffff" stroke="#3b82f6" stroke-width="8" />
    <circle cx="180" cy="340" r="24" fill="#ffffff" stroke="#1d4ed8" stroke-width="8" />
    <circle cx="120" cy="340" r="18" fill="#ffffff" stroke="#ef4444" stroke-width="6" />
    <path d="M 300 50 L 300 110 M 285 95 L 300 115 L 315 95" stroke="#ef4444" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
